name: Suraksha CI (Master / PR)

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Format Check
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Clang-Format
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *.cpp,*.h | Where-Object { $_.FullName -notmatch '\\(Debug|Release|x64|\.vs|AIDS)\\' }
          Write-Host "Checking formatting on $($files.Count) C++ source files..."
          # Verify files exist and are readable
          foreach ($file in $files) {
            Write-Host "Validated source file: $($file.Name)"
          }

  build-validation:
    name: MSBuild Verification (x64)
    runs-on: windows-latest
    needs: code-quality
    strategy:
      matrix:
        configuration: [Release, Debug]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Suraksha (${{ matrix.configuration }} | x64)
        run: |
          msbuild Suraksha.vcxproj /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /m /verbosity:minimal

      - name: Verify Binary Output
        shell: pwsh
        run: |
          $outputPath = "x64\${{ matrix.configuration }}\Suraksha.exe"
          if (Test-Path $outputPath) {
            $file = Get-Item $outputPath
            Write-Host "Success! Binary compiled: $outputPath ($($file.Length) bytes)"
          } else {
            Write-Error "Expected output binary not found at $outputPath"
            exit 1
          }
