name: Suraksha Release Pipeline (Stable & Beta)

on:
  push:
    branches:
      - release
      - 'release/**'
      - beta
      - 'beta/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build, Sign & Package (${{ github.ref_name }})
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Determine Release Metadata & Channel
        id: meta
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF
          $manualType = "${{ inputs.release_type }}"
          
          $isBeta = $false
          if ($manualType -eq "beta" -or $ref -like "refs/heads/beta*" -or $ref -like "*beta*") {
            $isBeta = $true
          }

          # Extract version and codename from Version.h if present
          $version = "2.0.0"
          $codename = "Kavach"
          if (Test-Path "Version.h") {
            $h = Get-Content "Version.h" -Raw
            if ($h -match '#define\s+SURAKSHA_VERSION_STRING\s+L"([^"]+)"') { $version = $Matches[1] }
            if ($h -match '#define\s+SURAKSHA_CODENAME\s+L"([^"]+)"') { $codename = $Matches[1] }
          }

          if ($ref -like "refs/tags/*") {
            $tag = $ref -replace "refs/tags/", ""
          } else {
            $tag = if ($isBeta) { "v$version-beta" } else { "v$version" }
          }

          $releaseName = if ($isBeta) {
            "Suraksha $tag [Beta] — $codename"
          } else {
            "Suraksha $tag [Stable] — $codename"
          }

          echo "is_beta=$isBeta" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "codename=$codename" >> $env:GITHUB_OUTPUT
          echo "release_name=$releaseName" >> $env:GITHUB_OUTPUT
          Write-Host "Prepared Release: $releaseName (Tag: $tag, Beta: $isBeta)"

      - name: Build Release Binary (x64)
        run: |
          msbuild Suraksha.vcxproj /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal

      - name: Setup Code Signing Certificate
        id: setup-cert
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          if ($env:CERT_BASE64 -and $env:CERT_PASS) {
            Write-Host "Decoding production code signing certificate from GitHub Secrets..."
            [IO.File]::WriteAllBytes("$env:TEMP\cert.pfx", [Convert]::FromBase64String($env:CERT_BASE64))
            echo "has_prod_cert=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No production certificate found in secrets. Creating self-signed test certificate..."
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Suraksha Open Source" -CertStoreLocation "Cert:\CurrentUser\My"
            $pwd = ConvertTo-SecureString -String "SurakshaTest123" -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath "$env:TEMP\cert.pfx" -Password $pwd
            $env:CERT_PASS = "SurakshaTest123"
            echo "has_prod_cert=false" >> $env:GITHUB_OUTPUT
          }

      - name: Sign Suraksha.exe
        shell: pwsh
        env:
          CERT_PASS: ${{ secrets.CERTIFICATE_PASSWORD || 'SurakshaTest123' }}
        run: |
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -Last 1).FullName
          if (-not $signtool) {
            $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*\x64\signtool.exe" } | Select-Object -Last 1).FullName
          }
          if (-not $signtool) {
            $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          }
          Write-Host "Using SignTool at: $signtool"
          
          & $signtool sign /f "$env:TEMP\cert.pfx" /p "$env:CERT_PASS" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "x64\Release\Suraksha.exe"
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Timestamp server unreachable, signing without timestamp..."
            & $signtool sign /f "$env:TEMP\cert.pfx" /p "$env:CERT_PASS" /fd SHA256 "x64\Release\Suraksha.exe"
          }
          Write-Host "Suraksha.exe successfully signed!"

      - name: Build MSIX Package
        shell: pwsh
        env:
          CERT_PASS: ${{ secrets.CERTIFICATE_PASSWORD || 'SurakshaTest123' }}
        run: |
          $stageDir = "$env:TEMP\SurakshaMsixStage"
          if (Test-Path $stageDir) { Remove-Item $stageDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "$stageDir\Assets" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          Copy-Item "x64\Release\Suraksha.exe" -Destination "$stageDir\Suraksha.exe" -Force
          Copy-Item "packaging\AppxManifest.xml" -Destination "$stageDir\AppxManifest.xml" -Force
          Copy-Item "packaging\Assets\*" -Destination "$stageDir\Assets\" -Force

          # Extract certificate subject non-interactively to ensure 100% exact publisher match in manifest
          $certObj = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("$env:TEMP\cert.pfx", "$env:CERT_PASS")
          $publisher = $certObj.Subject
          Write-Host "Syncing AppxManifest Publisher Identity to match certificate: $publisher"
          [xml]$manifest = Get-Content "$stageDir\AppxManifest.xml"
          $manifest.Package.Identity.Publisher = $publisher
          $manifest.Save("$stageDir\AppxManifest.xml")

          $makeappx = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64" -Filter "makeappx.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -Last 1).FullName
          if (-not $makeappx) {
            $makeappx = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "makeappx.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*\x64\makeappx.exe" } | Select-Object -Last 1).FullName
          }
          if (-not $makeappx) {
            $makeappx = (Get-Command makeappx.exe -ErrorAction SilentlyContinue).Source
          }
          Write-Host "Using MakeAppx at: $makeappx"
          
          $msixName = "dist\Suraksha-${{ steps.meta.outputs.tag }}-x64.msix"
          & "$makeappx" pack /d "$stageDir" /p "$msixName" /o

          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -Last 1).FullName
          if (-not $signtool) {
            $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*\x64\signtool.exe" } | Select-Object -Last 1).FullName
          }
          if (-not $signtool) {
            $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          }
          & $signtool sign /f "$env:TEMP\cert.pfx" /p "$env:CERT_PASS" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "$msixName"
          if ($LASTEXITCODE -ne 0) {
            & $signtool sign /f "$env:TEMP\cert.pfx" /p "$env:CERT_PASS" /fd SHA256 "$msixName"
          }
          Write-Host "MSIX package created and signed successfully!"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $isccPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $isccPath) {
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $isccPath)) {
            $isccPath = (Get-ChildItem -Path "C:\Program Files*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          Write-Host "Compiling installer with: $isccPath"
          & "$isccPath" "SurakshaSetup.iss"

      - name: Sign Inno Setup Installer
        shell: pwsh
        env:
          CERT_PASS: ${{ secrets.CERTIFICATE_PASSWORD || 'SurakshaTest123' }}
        run: |
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -Last 1).FullName
          if (-not $signtool) {
            $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*\x64\signtool.exe" } | Select-Object -Last 1).FullName
          }
          if (-not $signtool) {
            $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          }
          $installerPath = Get-ChildItem -Path "Output" -Filter "*.exe" | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Signing installer: $installerPath"

          & $signtool sign /f "$env:TEMP\cert.pfx" /p "$env:CERT_PASS" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "$installerPath"
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Timestamp server unreachable, signing without timestamp..."
            & $signtool sign /f "$env:TEMP\cert.pfx" /p "$env:CERT_PASS" /fd SHA256 "$installerPath"
          }
          Copy-Item "$installerPath" -Destination "dist\" -Force
          Write-Host "Installer successfully signed and copied to dist/!"

      - name: Clean Up Temporary Certificates
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:TEMP\cert.pfx") {
            Remove-Item "$env:TEMP\cert.pfx" -Force
            Write-Host "Temporary certificate removed from runner."
          }

      - name: Generate Checksums & Prepare Assets
        shell: pwsh
        run: |
          Copy-Item "x64\Release\Suraksha.exe" -Destination "dist\" -Force
          $files = Get-ChildItem -Path "dist" -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Out-File -FilePath "dist\SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist\SHA256SUMS.txt"

      - name: Upload Build Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Suraksha-${{ steps.meta.outputs.tag }}-Builds
          path: dist/
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          body: |
            ## 🛡️ ${{ steps.meta.outputs.release_name }}
            
            ### ✨ Highlights
            - **Codename**: `${{ steps.meta.outputs.codename }}`
            - **Native Windows Application Locker & Session Security**
            - **Sub-50ms Process Interception Engine**
            - **Hardware-bound DPAPI & Windows Hello Security**
            - **Zero Telemetry / 100% Offline Privacy Guarantee**
            
            ### 📦 Available Packages
            - **MSIX Package**: Modern Native Windows App Package
            - **Inno Setup Installer**: Classic Windows Setup Wizard
            - **Portable Binary**: Standalone single `.exe`
            - Verify downloads with `SHA256SUMS.txt`.
          files: dist/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ steps.meta.outputs.is_beta == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
